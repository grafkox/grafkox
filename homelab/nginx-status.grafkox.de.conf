# status.grafkox.de: serves one static JSON file to the profile-card workflow.
# Nothing is accepted or parsed; without the right token every request gets a 404.
#
# The token is NOT in this repo. It lives in a separate file in conf.d (mode 0640, group nginx):
#   map $http_authorization $homelab_stats_auth {
#       default 0;
#       "~^Bearer <64-hex-token>$" 1;
#   }
# (A regex key, because a plain 71-character key exceeds the default map_hash_bucket_size.)

server {
    listen 5806;
    server_name _;
    include /etc/nginx/snippets/common.conf;

    location = /homelab.json {
        limit_except GET { deny all; }
        if ($homelab_stats_auth = 0) { return 404; }
        limit_req zone=general burst=5 nodelay;

        alias /srv/homelab-stats/homelab.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location / { return 404; }
}
